name: Publish Foundry VTT module

on:
  push:
    branches: [main]
    paths:
      - "lipatos-player-currency-gm-audit.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract, repair manifest and package flat installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lipatos-extracted
          unzip -oq lipatos-player-currency-gm-audit.zip -d /tmp/lipatos-extracted
          manifest_file=$(find /tmp/lipatos-extracted -type f -name module.json -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$manifest_file" ]; then
            echo "Archive does not contain module.json" >&2
            exit 1
          fi
          src=$(dirname "$manifest_file")
          rsync -a --exclude='.git' --exclude='.github' --exclude='*.lock' "$src"/ ./
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          pkg = "lipatos-player-currency-gm-audit"
          m = Path("module.json")
          data = json.loads(m.read_text(encoding="utf-8"))
          if data.get("id") != pkg:
              raise SystemExit("Archive's module ID does not match the repository")
          data["manifest"] = f"https://raw.githubusercontent.com/lipatosss/{pkg}/main/module.json"
          data["download"] = f"https://github.com/lipatosss/{pkg}/releases/latest/download/{pkg}.zip"
          m.write_text(json.dumps(data, indent=2, ensure_ascii=False)+"\n", encoding="utf-8")
          with ZipFile(pkg+".zip", "w", ZIP_DEFLATED) as output:
              for file in sorted(Path(".").rglob("*")):
                  if not file.is_file():
                      continue
                  if (".git" in file.parts or ".github" in file.parts or
                      file.name == pkg+".zip" or file.name.endswith(".lock")):
                      continue
                  output.write(file, file.as_posix())
          PY

      - name: Commit source and installable archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync module source and normalized installable ZIP"
            git push origin HEAD:main
          fi

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./module.json').version")
          tag="v${version}"
          asset="lipatos-player-currency-gm-audit.zip"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
          else
            gh release create "${tag}" "${asset}" \
              --title "LipatoS — Аудит валюты и предметов ${tag}" \
              --notes "Установочный ZIP и манифест Foundry VTT." \
              --target main --latest
          fi
